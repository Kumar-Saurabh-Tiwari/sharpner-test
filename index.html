<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="container py-5">
      <header class="mb-4">
        <h1 class="h2 mb-1">Feedback</h1>
        <p class="text-secondary mb-0">Share your experience and help us improve.</p>
      </header>

      <div class="card">
        <div class="card-body">
          <h2 class="h5 mb-3">Leave feedback</h2>
          <form id="feedback-form">
            <label for="feedback-name" class="form-label">Your name</label>
            <input id="feedback-name" class="form-control" name="name" type="text" maxlength="80" autocomplete="name" required>

            <label for="feedback-rating" class="form-label mt-3">Rating</label>
            <select id="feedback-rating" class="form-select" name="rating" required>
              <option value="5">5 — Excellent</option>
              <option value="4">4 — Great</option>
              <option value="3">3 — Good</option>
              <option value="2">2 — Could be better</option>
              <option value="1">1 — Not great</option>
            </select>

            <div class="d-flex gap-2 mt-3">
              <button id="submit-button" class="btn btn-primary" type="submit">Submit</button>
              <button id="cancel-edit" class="btn btn-outline-secondary" type="button" hidden>Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-body">
          <h2 class="h5 mb-3">All feedback</h2>
          <div id="feedback-list" class="list-group list-group-flush" aria-live="polite"></div>
        </div>
      </div>

      <p id="status-message" class="mt-3 small" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
